{% extends "base.html" %}

{% block title %}Thông tin thí sinh{% endblock %}

{% block content %}
<div class="page-card">
    <h2>Thông tin thí sinh</h2>

    <form method="POST" class="form-grid">
        <div class="form-group">
            <label>CCCD</label>
            <input type="text" name="cccd" value="{{ candidate.cccd or '' }}">
        </div>

        <div class="form-group">
            <label>SBD</label>
            <input type="text" name="sbd" value="{{ candidate.sbd or '' }}">
        </div>

        <div class="form-group">
            <label>Mã hồ sơ</label>
            <input type="text" name="ma_ho_so" value="{{ candidate.ma_ho_so or '' }}">
        </div>

        <div class="form-group">
            <label>Họ tên</label>
            <input type="text" name="ho_ten" value="{{ candidate.ho_ten or '' }}">
        </div>

        <div class="form-group">
            <label>Ngày sinh</label>
            <input type="date" name="ngay_sinh" value="{{ candidate.ngay_sinh or '' }}">
        </div>

        <div class="form-group">
            <label>Giới tính</label>
            <input type="text" name="gioi_tinh" value="{{ candidate.gioi_tinh or '' }}">
        </div>

        <div class="form-group">
            <label>Dân tộc</label>
            <input type="text" name="dan_toc" value="{{ candidate.dan_toc or '' }}">
        </div>

        <div class="form-group">
            <label>Nơi sinh</label>
            <input type="text" name="noi_sinh" value="{{ candidate.noi_sinh or '' }}">
        </div>

        <div class="form-group">
            <label>Tỉnh/TP</label>
            <input type="text" name="tinh_tp" value="{{ candidate.tinh_tp or '' }}">
        </div>

        <div class="form-group">
            <label>Quận/Huyện</label>
            <input type="text" name="quan_huyen" value="{{ candidate.quan_huyen or '' }}">
        </div>

        <div class="form-group">
            <button type="submit" class="btn-submit">Cập nhật thông tin</button>
        </div>
    </form>
</div>
{% endblock %}
