{% extends "base.html" %}

{% block title %}Đăng nhập{% endblock %}

{% block content %}
<div class="login-wrapper">
    <div class="login-box">
        <div class="login-header">
            <h1 class="login-title">Đăng nhập</h1>
            <p class="login-subtitle">Hệ thống xét tuyển NEU</p>
        </div>

        {% if error %}
            <div class="login-error-alert">
                <span class="error-icon">⚠️</span>
                <p class="error-text">{{ error }}</p>
            </div>
        {% endif %}

        <form method="POST" class="login-form">
            <div class="form-group">
                <label for="username" class="form-label">
                    <span class="input-icon">👤</span>
                    Tên đăng nhập
                </label>
                <input type="text" id="username" name="username" class="form-input" placeholder="Nhập tên đăng nhập" required>
            </div>

            <div class="form-group">
                <label for="password" class="form-label">
                    <span class="input-icon">🔒</span>
                    Mật khẩu
                </label>
                <input type="password" id="password" name="password" class="form-input" placeholder="Nhập mật khẩu" required>
            </div>

            <button type="submit" class="btn-login-submit">Đăng nhập</button>
        </form>
    </div>
</div>
{% endblock %}
