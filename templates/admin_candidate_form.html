{% extends "base.html" %}

{% block title %}
    {% if candidate %}Sửa thí sinh{% else %}Thêm thí sinh{% endif %}
{% endblock %}

{% block content %}
<div class="page-card">
    <h2>
        {% if candidate %}Sửa thí sinh{% else %}Thêm thí sinh{% endif %}
    </h2>

    <form method="POST" class="form-grid">
        <div class="form-group">
            <label>CCCD</label>
            <input type="text" name="cccd" value="{{ candidate.cccd if candidate else '' }}" required>
        </div>

        <div class="form-group">
            <label>SBD</label>
            <input type="text" name="sbd" value="{{ candidate.sbd if candidate else '' }}" required>
        </div>

        <div class="form-group">
            <label>Mã hồ sơ</label>
            <input type="text" name="ma_ho_so" value="{{ candidate.ma_ho_so if candidate else '' }}" required>
        </div>

        <div class="form-group">
            <label>Họ tên</label>
            <input type="text" name="ho_ten" value="{{ candidate.ho_ten if candidate else '' }}" required>
        </div>

        <div class="form-group">
            <label>Ngày sinh</label>
            <input type="date" name="ngay_sinh" value="{{ candidate.ngay_sinh if candidate else '' }}">
        </div>

        <div class="form-group">
            <label>Giới tính</label>
            <input type="text" name="gioi_tinh" value="{{ candidate.gioi_tinh if candidate else '' }}">
        </div>

        <div class="form-group">
            <label>Dân tộc</label>
            <input type="text" name="dan_toc" value="{{ candidate.dan_toc if candidate else '' }}">
        </div>

        <div class="form-group">
            <label>Nơi sinh</label>
            <input type="text" name="noi_sinh" value="{{ candidate.noi_sinh if candidate else '' }}">
        </div>

        <div class="form-group">
            <label>Tỉnh/TP</label>
            <input type="text" name="tinh_tp" value="{{ candidate.tinh_tp if candidate else '' }}">
        </div>

        <div class="form-group">
            <label>Quận/Huyện</label>
            <input type="text" name="quan_huyen" value="{{ candidate.quan_huyen if candidate else '' }}">
        </div>

        <div class="form-group">
            <label>Năm tốt nghiệp</label>
            <input type="number" name="nam_tot_nghiep" value="{{ candidate.nam_tot_nghiep if candidate else '' }}">
        </div>

        <div class="form-group">
            <button type="submit" class="btn-submit">
                {% if candidate %}Cập nhật{% else %}Thêm mới{% endif %}
            </button>
        </div>
    </form>
</div>
{% endblock %}
